run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - revive

issues:
  exclude-rules:
    # Generated/seed and migration files are allowed to be looser.
    - path: database/seeds/
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
