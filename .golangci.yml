version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      # Curated rule set: keep the correctness-oriented checks, drop the
      # purely stylistic ones that conflict with this template's established
      # conventions (intentional ALL_CAPS enums, DB-aligned field names,
      # undocumented helpers, and cobra handler signatures with unused args).
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    rules:
      # Generated/seed and migration files are allowed to be looser.
      - path: database/seeds/
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
